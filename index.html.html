<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Address Information Finder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .card h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .results {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }
        .row:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: 600;
            color: #475569;
        }
        .value {
            color: #0f172a;
            font-weight: 500;
            word-break: break-all;
        }
        .loader {
            display: none;
            color: #2563eb;
            font-size: 14px;
            font-weight: 500;
            padding: 15px 0;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌐 IP Info Finder</h1>
    <p class="subtitle">Search detailed IP geolocation & network info</p>

    <div class="search-container">
        <input type="text" id="ipInput" placeholder="Enter IP address ">
        <button onclick="getIPInfo()">Search</button>
    </div>

    <div id="loader" class="loader">Fetching IP details...</div>

    <div class="results" id="resultsBox">
        <div class="row"><span class="label">IP Address</span><span class="value" id="res-ip">-</span></div>
        <div class="row"><span class="label">City</span><span class="value" id="res-city">-</span></div>
        <div class="row"><span class="label">Region / State</span><span class="value" id="res-region">-</span></div>
        <div class="row"><span class="label">Country</span><span class="value" id="res-country">-</span></div>
        <div class="row"><span class="label">ISP / Network</span><span class="value" id="res-isp">-</span></div>
        <div class="row"><span class="label">Timezone</span><span class="value" id="res-tz">-</span></div>
    </div>
</div>

<script>
    async function fetchIP(ip = '') {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';
        
        try {
            const endpoint = ip ? `http://ip-api.com/json/${ip}` : `http://ip-api.com/json/`;
            const response = await fetch(endpoint);
            const data = await response.json();
            
            loader.style.display = 'none';

            if (data.status === 'fail') {
                alert('Invalid IP Address!');
                return;
            }

            document.getElementById('res-ip').innerText = data.query || 'N/A';
            document.getElementById('res-city').innerText = data.city || 'N/A';
            document.getElementById('res-region').innerText = data.regionName || 'N/A';
            document.getElementById('res-country').innerText = data.country || 'N/A';
            document.getElementById('res-isp').innerText = data.isp || 'N/A';
            document.getElementById('res-tz').innerText = data.timezone || 'N/A';
        } catch (err) {
            loader.style.display = 'none';
            alert('Error fetching data. Try entering an IP like 8.8.8.8 manually.');
        }
    }

    function getIPInfo() {
        const ip = document.getElementById('ipInput').value.trim();
        fetchIP(ip);
    }

    window.onload = () => fetchIP('8.8.8.8');
</script>

</body>
</html>
